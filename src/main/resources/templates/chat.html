<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>聊天记录导出</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px 0;
            background: #f3f6fb;
            font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            color: #333;
        }

        .container {
            width: 960px;
            margin: 0 auto;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            padding: 24px 28px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
        }

        .header h2 {
            margin: 0 0 10px;
            font-size: 24px;
            font-weight: 600;
        }

        .header p {
            margin: 4px 0;
            font-size: 14px;
            opacity: 0.95;
        }

        .chat-area {
            padding: 28px 24px 36px;
            background: #f8fafc;
        }

        .empty {
            text-align: center;
            padding: 80px 20px;
            color: #94a3b8;
            font-size: 15px;
        }

        .message-row {
            display: flex;
            width: 100%;
            margin-bottom: 18px;
            align-items: flex-end;
        }

        .message-row.left {
            justify-content: flex-start;
        }

        .message-row.right {
            justify-content: flex-end;
        }

        .message-bubble-wrap {
            max-width: 72%;
            display: flex;
            flex-direction: column;
        }

        .message-row.left .message-bubble-wrap {
            align-items: flex-start;
        }

        .message-row.right .message-bubble-wrap {
            align-items: flex-end;
        }

        .sender {
            font-size: 12px;
            color: #64748b;
            margin-bottom: 6px;
            padding: 0 4px;
        }

        .message-card {
            display: inline-block;
            padding: 12px 14px;
            border-radius: 16px;
            line-height: 1.7;
            font-size: 14px;
            word-break: break-word;
            white-space: normal;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .message-row.left .message-card {
            background: #ffffff;
            color: #1e293b;
            border: 1px solid #e2e8f0;
            border-top-left-radius: 6px;
        }

        .message-row.right .message-card {
            background: #4f46e5;
            color: #ffffff;
            border-top-right-radius: 6px;
        }

        .content {
            white-space: pre-wrap;
        }

        .time {
            margin-top: 6px;
            font-size: 12px;
            color: #94a3b8;
            padding: 0 4px;
        }

        .message-row.right .time {
            text-align: right;
        }

        .message-row.left .time {
            text-align: left;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>聊天记录导出</h2>
        <p>会话ID：<span th:text="${sessionId}"></span></p>
        <p>导出时间：<span th:text="${exportTime}"></span></p>
    </div>

    <div class="chat-area">
        <div th:if="${#lists.isEmpty(messages)}" class="empty">
            当前会话暂无聊天记录
        </div>

        <div th:each="msg : ${messages}"
             th:class="${msg.self} ? 'message-row right' : 'message-row left'">
            <div class="message-bubble-wrap">
                <div class="sender" th:text="${msg.senderName}">发送者</div>
                <div class="message-card">
                    <div class="content" th:utext="${msg.content}">消息内容</div>
                </div>
                <div class="time" th:text="${msg.time}">2026-01-01 12:00:00</div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
